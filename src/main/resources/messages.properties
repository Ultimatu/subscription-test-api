# Titres et messages des erreurs produites par Spring lui-même (405, 415…), en français comme toutes les
# autres (ADR-0007). Clés : problemDetail.title.<exception> pour le titre, problemDetail.<exception> pour le
# message. Un message qui reçoit des arguments ({0}, {1}) est un MessageFormat : l'apostrophe s'y écrit ''.

# 405 : {0} la méthode refusée, {1} les méthodes acceptées
problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Méthode non autorisée
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=La méthode {0} n''est pas acceptée par cette URL ; méthodes acceptées : {1}

# 415 : {0} le type de contenu reçu, {1} les types acceptés
problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Type de contenu non pris en charge
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=Le type de contenu {0} n''est pas pris en charge ; types acceptés : {1}
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException.parseError=En-tête Content-Type illisible

# 406 : {0} les formats que l'API sait produire
problemDetail.title.org.springframework.web.HttpMediaTypeNotAcceptableException=Format de réponse indisponible
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException=Aucun des formats demandés par l''en-tête Accept n''est disponible ; formats possibles : {0}
problemDetail.org.springframework.web.HttpMediaTypeNotAcceptableException.parseError=En-tête Accept illisible

# 400 : {0} le nom du paramètre manquant
problemDetail.title.org.springframework.web.bind.MissingServletRequestParameterException=Requête invalide
problemDetail.org.springframework.web.bind.MissingServletRequestParameterException=Le paramètre {0} est obligatoire

# 404 : aucune route ne correspond à l'URL
problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Ressource introuvable
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=Aucune ressource ne correspond à cette URL
problemDetail.title.org.springframework.web.servlet.NoHandlerFoundException=Ressource introuvable
problemDetail.org.springframework.web.servlet.NoHandlerFoundException=Aucune ressource ne correspond à cette URL
