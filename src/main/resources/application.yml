spring:

  application:
    name: subscription-api
  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_db
    username: subscription_user
    password: subscription_pwd
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  mail:
    # Mailpit, fourni par compose.yaml : les emails s'affichent sur http://localhost:8025, rien ne part
    # vraiment. En production : SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME…
    # [::1] plutôt que localhost : sur macOS, FinderSync écoute souvent en IPv4 sur le même port
    # et les envois vers 127.0.0.1 timeoutent sans atteindre Mailpit (Compose, port 1026).
    host: "[::1]"
    port: 1026
    properties:
      # Sans délai maximal, un serveur de messagerie qui ne répond pas bloquerait l'envoi indéfiniment
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  web:
    # Messages de Bean Validation (« ne doit pas être vide »…) en français, quelle que soit la langue du client
    locale: fr
    locale-resolver: fixed

app:
  # Suppression et conservation des données (ADR-0013). Un client qui n'a jamais souscrit est toujours
  # supprimé définitivement : il n'a rien à conserver.
  deletion:
    # Un client qui a un historique de souscriptions est supprimé logiquement : masqué mais conservé.
    # false : il est supprimé définitivement dès DELETE /api/clients/{id}.
    soft-delete: true
    # Purge (suppression définitive) par un ADMIN : DELETE /api/clients/{id}/purge, et purge automatique.
    hard-delete: true
    retention:
      # Délai de conservation avant la purge. Désactivé en développement : purge immédiate possible.
      # En production : APP_DELETION_RETENTION_ENABLED=true.
      enabled: false
      period: P3Y
      # Purge automatique quotidienne des clients dont le délai est écoulé (heure d'Abidjan)
      purge-cron: "0 0 3 * * *"
  notifications:
    # Envoi des emails aux clients (ADR-0013) ; les notifications sont enregistrées dans tous les cas
    enabled: true
    from: "Subscription API <notifications@subscription-api.local>"
    dispatch-interval: 10s
  security:
    # Désactivable pour tester l'API sans jeton : APP_SECURITY_ENABLED=false
    enabled: true
    jwt:
      issuer: subscription-api
      validity: 1h
      # Clé HMAC de 256 bits (Base64), pour le développement uniquement : en production, elle est
      # fournie par la variable d'environnement APP_SECURITY_JWT_SECRET
      secret: 4UNwXJoVwONomSM7a6LtumqQ2mOm4Nh2FTS+GQrz1JA=
  cors:
    # Origines autorisées à appeler l'API depuis un navigateur
    # domaine : APP_CORS_ALLOWED_ORIGINS=https://front.example,https://autre.example. Aucune par défaut.
    allowed-origins: []

management:
  health:
    mail:
      # L'email n'est pas une dépendance critique : sans serveur de messagerie, les notifications
      # attendent dans l'outbox (ADR-0013). Sans ce réglage, /actuator/health passerait à DOWN.
      enabled: false

logging:
  level:
    # Le moteur PDF détaille chaque génération au niveau INFO
    com.openhtmltopdf: WARN
  pattern:
    # Chaque ligne de log porte l'identifiant de sa requête (voir RequestTracingFilter)
    correlation: "[%X{requestId:-}] "

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
