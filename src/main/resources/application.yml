spring:
  application:
    name: subscription-api
  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_db
    username: subscription_user
    password: subscription_pwd
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        max-page-size: 100
  web:
    # Messages de Bean Validation (« ne doit pas être vide »…) en français, quelle que soit la langue du client
    locale: fr
    locale-resolver: fixed

app:
  security:
    # Désactivable pour tester l'API sans jeton : APP_SECURITY_ENABLED=false
    enabled: true
    jwt:
      issuer: subscription-api
      validity: 1h
      # Clé HMAC de 256 bits (Base64), pour le développement uniquement : en production, elle est
      # fournie par la variable d'environnement APP_SECURITY_JWT_SECRET
      secret: 4UNwXJoVwONomSM7a6LtumqQ2mOm4Nh2FTS+GQrz1JA=

logging:
  level:
    # Le moteur PDF détaille chaque génération au niveau INFO
    com.openhtmltopdf: WARN
  pattern:
    # Chaque ligne de log porte l'identifiant de sa requête (voir RequestTracingFilter)
    correlation: "[%X{requestId:-}] "

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
