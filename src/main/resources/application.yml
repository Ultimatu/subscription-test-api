spring:
  application:
    name: subscription-api
  datasource:
    url: jdbc:postgresql://localhost:5432/subscription_db
    username: subscription_user
    password: subscription_pwd
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    # Bean Validation messages ("ne doit pas être vide"...) in French, whatever the client sends
    locale: fr
    locale-resolver: fixed
