# Chargé en plus de src/main/resources/application.yml pour tous les tests (IDE et Maven).
# Les tests utilisent leur propre schéma : les données créées via l'application lancée ne les
# perturbent jamais, sans nécessiter une seconde base de données.
spring:
  datasource:
    # public en second : on y trouve les fonctions de l'extension unaccent (migration V6)
    url: jdbc:postgresql://localhost:5432/subscription_db?currentSchema=test,public
  flyway:
    schemas: test

app:
  notifications:
    # Pas d'envoi planifié pendant les tests : ceux qui l'exercent appellent l'envoi directement
    enabled: false
