name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tests, couverture et collection Postman
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: subscription_db
          POSTGRES_USER: subscription_user
          POSTGRES_PASSWORD: subscription_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subscription_user -d subscription_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Tests unitaires et d'intégration (schéma « test »), puis seuils de couverture JaCoCo
      - name: Build et tests
        run: ./mvnw -B verify

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      # La collection Postman rejoue le scénario de l'énoncé et les règles métier sur l'application lancée
      - name: Démarrage de l'application
        run: |
          java -jar target/subscription-api-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Collection Postman (Newman)
        run: npx --yes newman@6.2.3 run postman/subscription-api.postman_collection.json --reporters cli

      - name: Logs de l'application
        if: failure()
        run: cat app.log
