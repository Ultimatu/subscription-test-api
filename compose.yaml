# Facultatif : fournit PostgreSQL à qui ne l'a pas installé, et Mailpit, qui reçoit les emails de
# notification sans les envoyer (interface web : http://localhost:8025).
#   docker compose up -d      puis      mvn spring-boot:run
# Base, utilisateur et mot de passe sont ceux de src/main/resources/application.yml.
# L'image officielle contient le module contrib (extension unaccent).
# Si un PostgreSQL local occupe déjà le port 5432 : POSTGRES_PORT=5433 docker compose up -d,
# puis lancer l'application avec SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5433/subscription_db.
# De même pour Mailpit : MAILPIT_SMTP_PORT=2025 docker compose up -d, puis SPRING_MAIL_PORT=2025.
# Tout en conteneurs, application comprise (image du Dockerfile, sans JDK ni Maven sur la machine) :
#   docker compose --profile app up --build      (APP_PORT=8083 si le port 8080 est déjà pris)
services:
  app:
    profiles: [app]
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/subscription_db
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
    ports:
      - "${APP_PORT:-8080}:8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: subscription_user
      POSTGRES_PASSWORD: subscription_pwd
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription_user -d subscription_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    environment:
      # Sans cela, Mailpit cherche le nom de chaque client par DNS inverse avant de répondre, ce qui
      # peut bloquer l'accueil SMTP dans Docker Desktop
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP, utilisé par l'application (spring.mail.port)
      - "8025:8025"   # interface web

volumes:
  postgres-data:
